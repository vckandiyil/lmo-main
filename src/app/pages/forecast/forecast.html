<app-filters></app-filters>
<div class="forecast__content">
  <div class="forecast__graphs">
    @for (widget of visibleWidgets(); track widget.id) {
      <app-forecast-card
        class="forecast__graphs-item"
        [title]="widget.title"
        [widgetId]="widget.id"
        [current]="{ label: '2024', mainValue: '86.9%', qoq: '0.4%', yoy: '1.3%' }"
        [forecast]="{ label: '2027 Forecast', mainValue: '89.2%', qoq: '0.3%', yoy: '0.7%' }"
        [target]="{ label: '2027 Target', mainValue: '85.3%', qoq: '0.1%', yoy: '0.4%' }"
      ></app-forecast-card>
    }
  </div>
  <app-button class="forecast__add-btn" variant="add-indicator"></app-button>
</div>
