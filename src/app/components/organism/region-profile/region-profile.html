<div class="region-profile" [class.region-profile--selected]="selected()" [class.region-profile--center]="isCenter()">
  <app-flip-card #flipCard>
    <app-widget-checkbox [selected]="selected()" front/>
    <app-widget-header [title]="'Region Profile'" [icons]="headerIcons()" [isCenter]="isCenter()" (starsClick)="flipCard.toggle()" (expandClick)="expandClick.emit()" front/>
    <div class="region-profile__body" front>
      @for (metric of allMetrics(); track metric.label) {
        <div class="region-profile__metric" [class.region-profile__metric--clickable]="isClickable(metric.label)" (click)="onMetricClick($event, metric.label)">
          <span class="region-profile__metric-label">{{ metric.label }}</span>
          <div class="region-profile__metric-data">
            <span class="region-profile__metric-value">{{ formatValue(metric) }}</span>
            <div class="region-profile__metric-chart">
              <app-chart-wrapper [options]="getChartOptions(metric.label)"/>
            </div>
          </div>
        </div>
      }
    </div>
    <app-widget-back back [widgetType]="widgetType()" (close)="flipCard.toggle()"></app-widget-back>
  </app-flip-card>
</div>
