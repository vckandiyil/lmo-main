<!-- Desktop/tablet: standard sidebar -->
<aside class="nav-sidebar" [class.nav-sidebar--expanded]="expanded()">
  <div class="nav-sidebar__top">
    <div class="nav-sidebar__nav">
      <a class="nav-sidebar__nav-item" routerLink="/" routerLinkActive="nav-sidebar__nav-item--active" [routerLinkActiveOptions]="{exact: true}" data-tooltip="Overview">
        <app-icon name="home-alt-slim-horiz" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">Overview</span>
      </a>
      <a class="nav-sidebar__nav-item" routerLink="/labor-market-insights" routerLinkActive="nav-sidebar__nav-item--active" data-tooltip="Labor Market Insights">
        <app-icon name="stats-up-square" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">Labor Market Insights</span>
      </a>
      <a class="nav-sidebar__nav-item" routerLink="/gap-analysis" routerLinkActive="nav-sidebar__nav-item--active" data-tooltip="Gap Analysis">
        <app-icon name="gap" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">Gap Analysis</span>
      </a>
      <a class="nav-sidebar__nav-item" routerLink="/forecast" routerLinkActive="nav-sidebar__nav-item--active" data-tooltip="Forecasts">
        <app-icon name="graph-up" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">Forecasts</span>
      </a>
      <a class="nav-sidebar__nav-item" routerLink="/what-if" routerLinkActive="nav-sidebar__nav-item--active" data-tooltip="What-If Simulator">
        <app-icon name="stats-report" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">What-If Simulator</span>
      </a>
      <a class="nav-sidebar__nav-item" (click)="openReportModal()" data-tooltip="Insights Reports">
        <app-icon name="page-search" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">Insights Reports</span>
      </a>
      <a class="nav-sidebar__nav-item" routerLink="/my-lmo" routerLinkActive="nav-sidebar__nav-item--active" data-tooltip="My LMO">
        <app-icon name="report-columns" size="24" class="nav-sidebar__icon"/>
        <span class="nav-sidebar__label">My LMO</span>
      </a>
    </div>
  </div>
  <div class="nav-sidebar__bottom">
    <div class="nav-sidebar__icon-wrap nav-sidebar__icon-wrap--clickable" (click)="openNotificationModal()" data-tooltip="Notifications">
      <app-icon name="notification" size="24" class="nav-sidebar__icon"/>
      <span class="nav-sidebar__label">Notifications</span>
    </div>
    <div class="nav-sidebar__icon-wrap" data-tooltip="Text Size">
      <app-icon name="text" size="24" class="nav-sidebar__icon"/>
      <span class="nav-sidebar__label">Text Size</span>
    </div>
    <div class="nav-sidebar__icon-wrap nav-sidebar__icon-wrap--clickable" (click)="toggleLanguage()" data-tooltip="Language">
      <app-icon name="language" size="24" class="nav-sidebar__icon"/>
      <span class="nav-sidebar__label">Language</span>
    </div>
    <div class="nav-sidebar__icon-wrap nav-sidebar__icon-wrap--clickable" (click)="toggleTheme()" data-tooltip="Dark mode">
      <app-icon [name]="isDarkMode() ? 'sun-light' : 'mode'" size="24" class="nav-sidebar__icon"/>
      <span class="nav-sidebar__label">Dark mode</span>
    </div>
  </div>
  <button class="nav-sidebar__toggle" (click)="toggle()" type="button">
    <span class="nav-sidebar__toggle-icon">
      <app-icon [name]="(expanded() !== isRtl()) ? 'nav-arrow-left' : 'nav-arrow-right'" size="22" color="#4A5662"/>
    </span>
  </button>
</aside>

<!-- Mobile: slide-in overlay nav -->
@if (mobileNavOpen()) {
  <div class="nav-overlay" (click)="closeMobileNav()">
    <aside class="nav-overlay__panel" (click)="$event.stopPropagation()">
      <div class="nav-overlay__header">
        <span class="nav-overlay__title">Menu</span>
        <button class="nav-overlay__close" type="button" (click)="closeMobileNav()">
          <app-icon name="close" size="16"/>
        </button>
      </div>
      <nav class="nav-overlay__nav">
        <a class="nav-overlay__item" routerLink="/" routerLinkActive="nav-overlay__item--active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileNav()">
          <app-icon name="home-alt-slim-horiz" size="20"/>
          <span>Overview</span>
        </a>
        <a class="nav-overlay__item" routerLink="/labor-market-insights" routerLinkActive="nav-overlay__item--active" (click)="closeMobileNav()">
          <app-icon name="stats-up-square" size="20"/>
          <span>Labor Market Insights</span>
        </a>
        <a class="nav-overlay__item" routerLink="/gap-analysis" routerLinkActive="nav-overlay__item--active" (click)="closeMobileNav()">
          <app-icon name="gap" size="20"/>
          <span>Gap Analysis</span>
        </a>
        <a class="nav-overlay__item" routerLink="/forecast" routerLinkActive="nav-overlay__item--active" (click)="closeMobileNav()">
          <app-icon name="graph-up" size="20"/>
          <span>Forecasts</span>
        </a>
        <a class="nav-overlay__item" routerLink="/what-if" routerLinkActive="nav-overlay__item--active" (click)="closeMobileNav()">
          <app-icon name="stats-report" size="20"/>
          <span>What-If Simulator</span>
        </a>
        <a class="nav-overlay__item" (click)="openReportModal(); closeMobileNav()">
          <app-icon name="page-search" size="20"/>
          <span>Insights Reports</span>
        </a>
        <a class="nav-overlay__item" routerLink="/my-lmo" routerLinkActive="nav-overlay__item--active" (click)="closeMobileNav()">
          <app-icon name="report-columns" size="20"/>
          <span>My LMO</span>
        </a>
      </nav>
      <div class="nav-overlay__footer">
        <a class="nav-overlay__item" (click)="openNotificationModal(); closeMobileNav()">
          <app-icon name="notification" size="20"/>
          <span>Notifications</span>
        </a>
        <a class="nav-overlay__item" (click)="toggleLanguage()">
          <app-icon name="language" size="20"/>
          <span>Language</span>
        </a>
        <a class="nav-overlay__item" (click)="toggleTheme()">
          <app-icon [name]="isDarkMode() ? 'sun-light' : 'mode'" size="20"/>
          <span>Dark mode</span>
        </a>
      </div>
    </aside>
  </div>
}

<app-notification-modal [isOpen]="isNotificationModalOpen()" (closed)="closeNotificationModal()"/>
<app-report-modal [isOpen]="isReportModalOpen()" (closed)="closeReportModal()"/>
