<div class="filters">
  <div class="filters__container">
    <div class="filters__dropdowns">
      <app-dropdown
        class="filters__topic-dropdown"
        [placeholder]="'Employment'"
        [value]="selectedTopic()"
        [options]="topicOptions()"
        (selected)="onTopicSelect($event)"
      />
      <app-dropdown
        [placeholder]="'LMI.REGION' | translate"
        [options]="regionOptions()"
        [variant]="'secondary'"
        (selected)="onFilterChange('region', $event)"
      />
      <app-dropdown
        [placeholder]="'HOME.CITIZENSHIP' | translate"
        [options]="citizenshipOptions()"
        [variant]="'secondary'"
        (selected)="onFilterChange('citizenship', $event)"
      />
      <app-dropdown
        [placeholder]="'HOME.GENDER' | translate"
        [options]="genderOptions()"
        [variant]="'secondary'"
        (selected)="onFilterChange('gender', $event)"
      />
      <app-dropdown
        [placeholder]="'LMI.SECTOR' | translate"
        [options]="sectorOptions()"
        [variant]="'secondary'"
        (selected)="onFilterChange('sector', $event)"
      />
      <app-dropdown
        [placeholder]="'LMI.YEAR' | translate"
        [options]="yearOptions()"
        [variant]="'secondary'"
        (selected)="onFilterChange('year', $event)"
      />
      <button class="filters__clear" type="button" aria-label="Clear filters" (click)="clearFilters()">
        <span class="filters__clear-icon"></span>
      </button>
    </div>
    <div class="filters__submit-section">

      <button class="filters__presentation-btn" type="button" (click)="openPresentationModal()">
        <app-icon name="presentation" size="20"/>
      </button>
      <button class="filters__layout-btn" type="button" (click)="toggleLayout()">
        <app-icon [name]="layoutMode() === '3col' ? 'layout-3col' : 'layout-4col'" size="16"/>
      </button>
      <div class="filters__search">
        <div class="filters__search-left">
          <app-icon class="filters__search-icon" name="search" size="20" color="#3375C6"/>
          <input
            type="text"
            class="filters__search-field"
            placeholder="Search with AI..."
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            (keydown.enter)="openSearchModal()"
          />
        </div>
        <div class="filters__search-right">
          <app-icon
            class="filters__search-mic"
            [name]="isMicSpeaking() ? 'mic-speaking' : 'microphone'"
            size="20"
            (click)="toggleMic()"
          />
          <button class="filters__search-button" type="button" (click)="openSearchModal()">
            <app-icon name="nav-arrow-right" size="20" color="#FFFFFF"/>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-presentation-modal
  [isOpen]="isPresentationModalOpen()"
  (closed)="closePresentationModal()"
/>

<app-search-modal
  [isOpen]="isSearchModalOpen()"
  [searchQuery]="searchQuery()"
  (closed)="closeSearchModal()"
/>
