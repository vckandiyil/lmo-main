<button
  class="ai-chat__toggle-btn"
  [class.ai-chat__toggle-btn--active]="isOpen()"
  (click)="toggle()">
  @if (isAnimating()) {
    @if (isOpen()) {
      <img class="ai-chat__toggle-icon ai-chat__toggle-icon--leaving" src="assets/images/icons/AI Assistant.png" alt="AI Assistant"/>
      <div class="ai-chat__toggle-arrow ai-chat__toggle-arrow--entering">
        <div class="ai-chat__toggle-arrow-icon"></div>
      </div>
    } @else {
      <div class="ai-chat__toggle-arrow ai-chat__toggle-arrow--leaving">
        <div class="ai-chat__toggle-arrow-icon"></div>
      </div>
      <img class="ai-chat__toggle-icon ai-chat__toggle-icon--entering" src="assets/images/icons/AI Assistant.png" alt="AI Assistant"/>
    }
  } @else if (isOpen()) {
    <div class="ai-chat__toggle-arrow">
      <div class="ai-chat__toggle-arrow-icon"></div>
    </div>
  } @else {
    <img class="ai-chat__toggle-icon" src="assets/images/icons/AI Assistant.png" alt="AI Assistant"/>
  }
</button>

@if (isOpen()) {
  <div class="ai-chat__panel" @slideInOut>
    <img class="ai-chat__assistant-icon" src="assets/images/icons/AI Assistant.png" alt="AI Assistant" />
    <div class="ai-chat__content">
      <span class="ai-chat__greeting">{{ 'LMI.AI_HELLO' | translate }}</span>
      <span class="ai-chat__question">{{ 'LMI.AI_WHAT_KNOW' | translate }}</span>
    </div>
    <div class="ai-chat__suggestions">
      <div class="ai-chat__suggestion-item">
        <app-icon name="stars" color="#3375C6" size="24"/>
        <span class="ai-chat__suggestion-text">{{ 'LMI.AI_SUGGESTION' | translate }}</span>
      </div>
      <div class="ai-chat__suggestion-item">
        <app-icon name="stars" color="#3375C6" size="24"/>
        <span class="ai-chat__suggestion-text">{{ 'LMI.AI_SUGGESTION' | translate }}</span>
      </div>
      <div class="ai-chat__suggestion-item">
        <app-icon name="stars" color="#3375C6" size="24"/>
        <span class="ai-chat__suggestion-text">{{ 'LMI.AI_SUGGESTION' | translate }}</span>
      </div>
    </div>
    <div class="ai-chat__search">
      <div class="ai-chat__search-input-wrapper">
        <input
          type="text"
          class="ai-chat__search-field"
          [placeholder]="'LMI.AI_PLACEHOLDER' | translate"
        />
      </div>
      <div class="ai-chat__search-right">
        <app-icon class="ai-chat__search-mic" name="microphone" size="16"/>
        <div class="ai-chat__search-button">
          <app-icon name="nav-arrow-right" color="#FFFFFF" size="20"/>
        </div>
      </div>
    </div>
  </div>
}
