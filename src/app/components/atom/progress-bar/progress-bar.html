<div
  class="progress-bar"
  [style.height.px]="height"
  [style.border-radius.px]="borderRadius"
  [style.background]="backgroundColor"
>
  <div
    class="progress-bar__fill"
    [style.width.%]="percentage"
    [style.background]="fillColor"
    [style.border-radius.px]="borderRadius"
  ></div>
</div>
